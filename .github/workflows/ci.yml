# Phase 0 Sprint 2 — minimal CI (Constitution VII.4).
# Pipeline: install → import validation → regression tests → tenant-isolation
# suite (BLOCKING, per Immutable Core I.1). Deliberately no Docker, no deploy
# stage, no lint yet — later sprints extend this file; they do not replace it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      # NOTE: DATABASE_URL is deliberately NOT set job-wide — each regression
      # test self-configures its own database via os.environ.setdefault().
      SECRET_KEY: ci-secret
      ADMIN_KEY: ci-admin
      BROADCAST_API_KEY: ci-broadcast
      GEMINI_API_KEY: ""
      PRIMARY_TENANT_ID: ""
      FLASK_ENV: development
    steps:
      # Phase 1D: full history. Several phase-scope guards read git history
      # (the commit that added a marker file, `git show <old sha>:<file>`);
      # the default depth-1 clone made every file look added by one commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Phase 1 CI repair: RC1.1 (328de66, 2026-08-01) moved the isolation gate
      # and the regression suite onto `python -m pytest` but never installed
      # pytest, so every run since has stopped at the isolation step with
      # "No module named pytest" and skipped every step after it. pytest is a
      # test-only tool, so it is installed here and NOT added to
      # requirements.txt, which is the production build.
      - name: Install test runner
        run: pip install pytest==9.1.1

      # Phase 1 CI repair: importing app.services.whatsapp_service starts a
      # thread that GETs the Graph API (validate_token). CI has no token, so it
      # was a live, credential-less request to graph.facebook.com on every run
      # ("Token invalid: 400"). No test needs the network: from here on every
      # outbound HTTP request goes to a dead local proxy and fails fast as a
      # transport error. Set after the installs above, which do need it.
      - name: Block outbound network for the test steps
        run: |
          echo "HTTP_PROXY=http://127.0.0.1:9" >> "$GITHUB_ENV"
          echo "HTTPS_PROXY=http://127.0.0.1:9" >> "$GITHUB_ENV"
          echo "NO_PROXY=" >> "$GITHUB_ENV"

      # Phase RC2.5.8 (P2-2): CI no longer carries a WABA encryption key of its
      # own. The job-wide literal here was the PRODUCTION key, so every CI run,
      # every fork and every log reader had it. Nothing in this pipeline needs a
      # stable key -- the suites only need create_app() to boot -- so one is
      # generated per run and written to the step environment, never echoed.
      - name: Generate ephemeral WABA encryption key for this run
        run: |
          python -c "from cryptography.fernet import Fernet; print('WABA_ENCRYPTION_KEY=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"

      - name: Application import validation
        env:
          DATABASE_URL: "sqlite:///ci_import_check.db"
        run: |
          python -c "
          from app import create_app
          app = create_app()
          n = len(list(app.url_map.iter_rules()))
          assert n > 50, f'suspiciously few routes: {n}'
          print(f'create_app() OK — {n} routes registered')
          "

      - name: Regression — adapter sync (ADR-020)
        run: python tests/test_adapter_sync_16_5a6j.py

      - name: Regression — task engine (16.5A7-B)
        run: python tests/test_task_engine_16_5a7b.py

      - name: Regression — task & notification foundation (ADR-021)
        run: python tests/test_task_notification_16_5a7.py

      - name: Regression — legacy completion authorization (16.5A7-D)
        run: python tests/test_legacy_completion_auth_16_5a7d.py

      # Phase RC1.1 (B1): invoked via pytest, NOT `python tests/...`.
      #
      # Phase 14B.1 rewrote this file from a standalone script into a pytest
      # suite. The old script ended in sys.exit(0 if passed else 1), which is
      # where this step got its signal; the rewrite removed it, so
      # `python tests/test_tenant_isolation.py` exited 0 having run ZERO
      # assertions. The blocking security gate passed unconditionally.
      #
      # Verified before/after: as a script it exits 0 with no output; under
      # pytest it runs 53 tests and returns a real status.
      - name: Tenant isolation suite (BLOCKING — Constitution I.1)
        run: python -m pytest tests/test_tenant_isolation.py -q

      # Phase RC1.1 (B3): these suites existed only on a developer machine and
      # were invisible to CI until now.
      - name: Platform security suite (BLOCKING — Phase 14C)
        run: python -m pytest tests/test_platform_security_14c.py -q

      - name: Tenant provisioning suite (BLOCKING — Phase 14D)
        run: python -m pytest tests/test_tenant_provisioning_14d.py -q

      # Runs FILE-BY-FILE, deliberately. tests/conftest.py installs shared
      # sys.modules stubs at collection time, so batching directories causes
      # cross-file contamination — proven in Phase 14B.1, where marketing +
      # campaign suites batched together produced 24 failures that vanish
      # entirely when the same files run individually.
      #
      # EXCLUDE is a DENY-list, not an allow-list, so a newly added test file
      # is picked up automatically instead of being silently skipped.
      - name: Regression suite (pytest, file-by-file)
        run: |
          EXCLUDE="
            test_tenant_isolation.py
            test_platform_security_14c.py
            test_tenant_provisioning_14d.py
            test_adapter_sync_16_5a6j.py
            test_task_engine_16_5a7b.py
            test_task_notification_16_5a7.py
            test_legacy_completion_auth_16_5a7d.py
            test_entry_points_and_transport.py
            test_marketing_routes_create.py
            test_router_navigation.py
            test_routing_phase1.py
            test_screens_builder.py
          "
          fail=0
          for f in tests/test_*.py; do
            base=$(basename "$f")
            case " $(echo $EXCLUDE) " in *" $base "*) echo "skip  $base"; continue;; esac
            echo "---- $base"
            python -m pytest "$f" -q || fail=1
          done
          exit $fail

      # Phase 1 CI repair: lift the network block again so the post-job steps
      # (setup-python's pip cache save) can reach GitHub. Runs even when a test
      # step failed; it changes nothing about the job's result.
      - name: Restore outbound network for post-job steps
        if: always()
        run: |
          echo "HTTP_PROXY=" >> "$GITHUB_ENV"
          echo "HTTPS_PROXY=" >> "$GITHUB_ENV"
